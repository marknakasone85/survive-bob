<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survive Bob</title>
<!-- Security: the page may load only its own files, and sends nothing anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="A free run-and-gun game you play in your browser. Chase Bob, a fat, sloppy villain, across 20 levels from America to Washington, D.C. Works on computers, phones and tablets.">
<meta name="theme-color" content="#14110f">

<!-- Link previews: what shows up when someone shares the link in a text, chat or post. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Survive Bob">
<meta property="og:title" content="Survive Bob">
<meta property="og:description" content="A free run-and-gun game you play in your browser. Chase Bob across 20 levels, from America to Washington, D.C.">
<meta property="og:url" content="https://marknakasone85.github.io/survive-bob/">
<meta property="og:image" content="https://marknakasone85.github.io/survive-bob/assets/screenshot.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:image:alt" content="Survive Bob in Tokyo: Rusty fires at Bob, who yells IT'S RAININ' JUNK!">
<meta name="twitter:card" content="summary_large_image">

<!-- Icons, and "Add to Home Screen" so it opens full screen like an app. -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Survive Bob">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preload" href="assets/fonts/bungee-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="Survive Bob game screen"></canvas>

<button id="fullBtn" type="button" aria-label="Full screen" title="Full screen (F)" hidden>
  <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>
  <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6"/></svg>
</button>

<div id="touch" hidden>
  <button class="tb" id="bLeft" data-key="ArrowLeft" aria-label="Move left">◀</button>
  <button class="tb" id="bRight" data-key="ArrowRight" aria-label="Move right">▶</button>
  <button class="tb sm" id="bDown" data-key="ArrowDown" aria-label="Drop down">▼</button>
  <button class="tb big" id="bFire" data-key="KeyJ">FIRE</button>
  <button class="tb big" id="bJump" data-key="Space">JUMP</button>
  <button class="tb sm" id="bGun" data-key="KeyQ">GUN</button>
  <button class="tb sm" id="bNade" data-key="KeyK" aria-label="Throw grenade">💣</button>
  <button class="tb xs" id="bPause" data-key="KeyP" aria-label="Pause">II</button>
</div>
<div id="rotate">Turn your phone sideways for a bigger screen</div>

<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/props.js"></script>
<script src="js/levels.js"></script>
<script src="js/art-more.js"></script>
<script src="js/levels-more.js"></script>
<script src="js/levels-extra.js"></script>
<script src="js/heroes.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/enemies-more.js"></script>
<script src="js/world1.js"></script>
<script src="js/world2.js"></script>
<script src="js/bob.js"></script>
<script src="js/dc.js"></script>
<script src="js/waves.js"></script>
<script src="js/game.js"></script>
</body>
</html>
